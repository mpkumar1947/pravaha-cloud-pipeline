services:
  request-portal:
    image: fallenbagel/jellyseerr:latest  
    container_name: request-portal
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
    ports:
      - 5055:5055
    volumes:
      - ./config/jellyseerr:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  movie-manager:
    image: lscr.io/linuxserver/radarr:latest
    container_name: movie-manager
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    ports:
      - 7878:7878
    volumes:
      - ./config/radarr:/config
      - /mnt/torrents:/downloads
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - ~/.config/rclone:/config/.config/rclone:rw
      - /usr/local/bin/pravaha-upload.sh:/usr/local/bin/pravaha-upload.sh:ro
      - /mnt/vault:/mnt/vault:shared
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  tv-manager:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: tv-manager
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    ports:
      - 8989:8989
    volumes:
      - ./config/sonarr:/config
      - /mnt/torrents:/downloads
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - ~/.config/rclone:/config/.config/rclone:rw
      - /usr/local/bin/pravaha-upload.sh:/usr/local/bin/pravaha-upload.sh:ro
      - /mnt/vault:/mnt/vault:shared
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  download-client:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: download-client
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    ports:
      - 8080:8080
      - 45123:45123
      - 45123:45123/udp
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/torrents:/downloads
      - /mnt/vault:/mnt/vault:shared
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - ~/.config/rclone:~/.config/rclone:ro
      - /usr/local/bin/pravaha-upload.sh:/usr/local/bin/pravaha-upload.sh:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  media-server:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: media-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    ports:
      - 8096:8096
    volumes:
      - ./config/jellyfin:/config
      - /mnt/vault:/mnt/vault:shared
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  indexer-gateway:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: indexer-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    ports:
      - 9696:9696
    volumes:
      - ./config/prowlarr:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
    ports:
      - 8191:8191
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
